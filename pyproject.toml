[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-valuation"
version = "0.1.0"
description = "US/KR listed company valuation tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.2.0",
  "lxml>=5.2.0",
  "pykrx>=1.0.48",
  "finance-datareader>=0.9.90",
]

[project.scripts]
company-valuation = "company_valuation.cli:main"

[tool.setuptools.packages.find]
include = ["company_valuation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]