name: 📧 아침 9시 증시 요약 이메일

on:
  schedule:
    # 매일 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: write

jobs:
  morning-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: Run summary email
        env:
          EMAIL_TO: "hj.kwon@telechips.com"
          EMAIL_FROM: "ghdkfndk@gmail.com"
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python scripts/stock_news.py --summary
